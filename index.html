<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>漫画仕入れ管理 Pro 3.8</title>
<style>
:root {
  --bg:#090909; --panel:#161616; --panel2:#202020; --line:#343434;
  --text:#f6f2e8; --muted:#aaa; --gold:#f5c84c; --green:#28c76f;
  --red:#ff5d5d; --blue:#62a8ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(#050505,#101010);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;min-height:100vh}
button,input{font:inherit}
#splash{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;transition:.45s}
#splash.hide{opacity:0;pointer-events:none}
.logo{text-align:center}
.logo .ball{font-size:58px;filter:drop-shadow(0 0 16px #ff9d00)}
.logo h1{margin:10px 0 4px;color:var(--gold);letter-spacing:.08em;font-size:28px}
.logo p{color:#ddd;margin:0;font-weight:700}
header{position:sticky;top:0;z-index:10;background:rgba(8,8,8,.94);backdrop-filter:blur(10px);border-bottom:1px solid #2b2b2b;padding:12px}
.topline{display:flex;gap:10px;align-items:center;margin-bottom:10px}
h1{font-size:20px;margin:0;flex:1;color:var(--gold)}
.badge{font-size:12px;background:#2b240f;color:var(--gold);padding:6px 9px;border-radius:999px;border:1px solid #5c4b19;transition:.2s}
.badge.saved{background:#102b1a;color:#7ee7a7;border-color:#285c3b}
.badge.error{background:#381717;color:#ff9c9c;border-color:#7e3030}
.search{display:flex;gap:8px}
.search input{width:100%;border:1px solid var(--line);background:#151515;color:#fff;border-radius:13px;padding:13px 14px;outline:none}
.search input:focus{border-color:var(--gold)}
.reset{border:0;background:#292929;color:#ddd;border-radius:12px;padding:0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px 0;max-width:900px;margin:auto}
.stat{background:var(--panel);border:1px solid #292929;border-radius:14px;padding:11px;text-align:center;color:inherit}
.stat b{display:block;font-size:19px;color:var(--gold)} .stat span{font-size:11px;color:var(--muted)}
.stat-button{width:100%;cursor:pointer}
.stat-button.active{background:#12351f;border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.stat-button.active b,.stat-button.active span{color:#8ff0b3}
.purchased-guide{background:#12351f;border:1px solid #286d43;border-radius:14px;padding:12px 14px;margin:12px 0;color:#b9f6ce}
.purchased-guide strong{font-size:14px}
.filters{display:flex;gap:8px;overflow:auto;padding:10px 12px;max-width:900px;margin:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;border:1px solid #373737;background:#181818;color:#ddd;border-radius:999px;padding:9px 12px}
.filter.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:800}
main{padding:0 12px 90px;max-width:900px;margin:auto}
.category-title{font-size:14px;color:var(--gold);margin:18px 4px 8px;font-weight:800}
.card{background:var(--panel);border:1px solid #2d2d2d;border-radius:16px;margin-bottom:10px;overflow:hidden}
.card-head{display:flex;align-items:center;padding:15px;cursor:pointer;gap:10px}
.card-head strong{flex:1;font-size:16px}
.chev{color:var(--gold);transition:.2s}
.delete-title{border:1px solid #713535;background:#301919;color:#ff9c9c;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.delete-title:active{background:#562424}
.delete-title.armed{background:#b42323;border-color:#ff7b7b;color:#fff}
.card.open .chev{transform:rotate(90deg)}
.card-body{display:none;border-top:1px solid #292929;padding:12px}
.card.open .card-body{display:block}
.group{margin-bottom:14px} .group:last-child{margin-bottom:0}
.group-label{font-size:12px;color:#c9b66a;margin-bottom:8px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #494949;background:#222;color:#fff;border-radius:12px;padding:10px 12px;min-width:46px;text-align:center;font-weight:700;user-select:none}
.chip.done{background:var(--green);border-color:var(--green);color:#04140b}
.chip.stock{border-color:#4f7db5;color:#bcd8ff;background:#182432}
.chip.stock.done{background:var(--green);border-color:var(--green);color:#04140b}
.chip.special{border-color:#725fb0;color:#d8ccff;background:#241e38}
.note{background:#2a2617;color:#ffe590;border-left:4px solid var(--gold);padding:10px 12px;border-radius:10px;line-height:1.5}
.counter-row{display:flex;align-items:center;gap:10px;background:#222;border:1px solid #3a3a3a;border-radius:12px;padding:10px;margin-bottom:8px}
.counter-row:last-child{margin-bottom:0}
.counter-name{flex:1;font-weight:700}
.counter-boxes{display:flex;gap:6px}
.counter-box{width:24px;height:24px;border:1px solid #666;border-radius:6px;background:#111}
.counter-box.on{background:var(--green);border-color:var(--green)}
.empty{text-align:center;color:#999;padding:50px 20px}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,8,.96);border-top:1px solid #292929;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:11}
.footer-inner{max-width:900px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.footer-btn{border:1px solid #444;background:#1a1a1a;color:#eee;border-radius:13px;padding:12px}
.footer-btn.primary{background:var(--gold);color:#111;border-color:var(--gold);font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;display:none;align-items:flex-end}
.modal.show{display:flex}
.sheet{background:#171717;width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
.sheet h2{margin:0 0 14px;color:var(--gold)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:#bbb;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:#0f0f0f;color:white;border:1px solid #444;border-radius:12px;padding:12px}
.title-volume-row{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px}
.title-volume-row .field{min-width:0}
.final-volume-wrap{position:relative}
.final-volume-wrap input{padding-right:30px;text-align:center;font-weight:800}
.final-volume-wrap span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#aaa;pointer-events:none}
.form-help{margin:-2px 0 14px;color:#aaa;font-size:12px;line-height:1.5}
.actions{display:flex;gap:8px}
.actions button{flex:1;border:0;border-radius:12px;padding:12px}
.save{background:var(--gold);font-weight:800} .cancel{background:#333;color:white}
.log-list{display:grid;gap:9px}
.log-item{background:#222;border:1px solid #363636;border-radius:12px;padding:11px 12px}
.log-time{font-size:12px;color:var(--gold);margin-bottom:4px}
.log-text{font-size:14px;line-height:1.45}
.log-empty{text-align:center;color:#999;padding:35px 10px}
.log-actions{display:flex;gap:8px;margin-top:15px;position:sticky;bottom:0;background:#171717;padding-top:10px}
.log-actions button{flex:1;border:0;border-radius:12px;padding:12px}
.danger{background:#461e1e;color:#ffaaaa}
.confirm-modal{align-items:center;padding:20px}
.confirm-box{background:#191919;width:min(100%,420px);border:1px solid #444;border-radius:20px;padding:20px;box-shadow:0 18px 60px rgba(0,0,0,.65)}
.confirm-box h2{margin:0 0 10px;color:var(--gold);font-size:20px}
.confirm-box p{margin:0 0 18px;color:#eee;line-height:1.6}
.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm-actions button{border:0;border-radius:13px;padding:14px 10px;font-weight:800}
.confirm-back{background:#333;color:#fff}
.confirm-remove{background:var(--red);color:#190303}
@media(min-width:700px){.card-head strong{font-size:17px}}

.footer-inner.footer-four{grid-template-columns:repeat(4,1fr)}
.footer-inner.footer-four .footer-btn{padding:12px 5px;font-size:13px}
.calc-grid{
  display:grid;
  grid-template-columns:minmax(92px,1.25fr) 58px 68px 58px;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
}
.calc-grid .price-label,.calc-grid .price-input{
  min-height:56px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:19px;border-radius:12px
}
.calc-grid .price-label{color:#f4e7b0;background:#222;border:1px solid #444}
.calc-grid .price-input{
  width:100%;background:#0f0f0f;color:#fff;border:1px solid #555;
  text-align:center;padding:8px
}
.calc-grid button{
  min-width:58px;min-height:58px;border:1px solid #555;background:#292929;
  color:#fff;border-radius:13px;font-size:26px;font-weight:900;touch-action:manipulation
}
.calc-grid .qty{min-width:58px;text-align:center;font-weight:900;color:var(--gold);font-size:16px}
.calc-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc-summary{background:#0f0f0f;border:1px solid #3b3b3b;border-radius:14px;padding:13px;margin:14px 0}
.calc-summary div{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.calc-summary b{color:var(--gold)}
.judgement{border-radius:16px;padding:18px;text-align:center;margin-top:12px;border:2px solid #555}
.judgement .go{font-size:34px;font-weight:1000;letter-spacing:.05em}
.judgement .rank{font-size:20px;margin:5px 0}
.judgement .message{font-weight:800}
.judgement.green{background:#102d1d;border-color:#28c76f}
.judgement.blue{background:#12253b;border-color:#62a8ff}
.judgement.yellow{background:#332b0e;border-color:#f5c84c}
.judgement.red{background:#351313;border-color:#ff5d5d}
.calc-note{font-size:12px;color:#aaa;line-height:1.6;margin-top:8px}
.required-input{border-color:var(--red)!important;background:#2a1111!important}
.required-input.filled{border-color:#444!important;background:#0f0f0f!important}
#calcModal button,#calcModal input,#calcModal select{touch-action:manipulation}
@media(max-width:480px){
  .footer-inner.footer-four{gap:6px}
  .footer-inner.footer-four .footer-btn{font-size:12px;padding:11px 3px}
  .calc-grid{grid-template-columns:minmax(76px,1fr) 56px 62px 56px;gap:7px}
}

</style>
</head>
<body>
<div id="splash"><div class="logo"><div class="ball">⭐</div><h1>MANGA STOCK PRO</h1><p>BOOKOFF 仕入れ管理</p></div></div>

<header>
  <div class="topline">
    <h1>漫画仕入れ管理 Pro 3.8</h1>
    <span class="badge" id="saveStatus" role="status" aria-live="polite">保存を確認中</span>
  </div>
  <div class="search">
    <input id="search" type="search" placeholder="作品名・巻数・メモを検索">
    <button class="reset" id="clearSearch">×</button>
  </div>
</header>

<section class="stats">
  <div class="stat"><b id="titleCount">0</b><span>作品数</span></div>
  <div class="stat"><b id="targetCount">0</b><span>対象数</span></div>
  <button class="stat stat-button" id="purchasedView" type="button" aria-pressed="false"><b id="doneCount">0</b><span>購入済み</span></button>
</section>

<div class="filters" id="filters"></div>
<main id="app"></main>

<footer>
  <div class="footer-inner footer-four">
    <button class="footer-btn" id="closeAll">閉じる</button>
    <button class="footer-btn" id="showLog">履歴</button>
    <button class="footer-btn" id="openCalc">🧮 計算</button>
    <button class="footer-btn primary" id="addTitle">＋ 作品</button>
  </div>
</footer>

<div class="modal" id="modal">
  <div class="sheet">
    <h2>作品を追加</h2>
    <div class="field"><label>カテゴリー</label><select id="newCategory"></select></div>
    <div class="title-volume-row">
      <div class="field"><label>作品名</label><input id="newTitle" placeholder="例：キングダム" autocomplete="off"></div>
      <div class="field"><label>最終巻</label><div class="final-volume-wrap"><input id="newFinalVolume" type="number" inputmode="numeric" min="1" max="300" placeholder="72"><span>巻</span></div></div>
    </div>
    <p class="form-help">入力した最終巻まで、1巻からすべて自動表示します。</p>
    <div class="actions"><button class="cancel" id="cancelAdd">キャンセル</button><button class="save" id="saveAdd">保存</button></div>
  </div>
</div>


<div class="modal" id="calcModal">
  <div class="sheet">
    <h2>🧮 仕入れ計算</h2>

    <div class="calc-grid" data-price="110">
      <div class="price-label">110円</div>
      <button type="button" class="qty-minus">−</button>
      <div class="qty">0冊</div>
      <button type="button" class="qty-plus">＋</button>
    </div>
    <div class="calc-grid" data-price="132">
      <div class="price-label">132円</div>
      <button type="button" class="qty-minus">−</button>
      <div class="qty">0冊</div>
      <button type="button" class="qty-plus">＋</button>
    </div>
    <div class="calc-grid" data-price="0">
      <input class="price-input custom-row-price" inputmode="numeric" type="number" min="0" placeholder="価格">
      <button type="button" class="qty-minus">−</button>
      <div class="qty">0冊</div>
      <button type="button" class="qty-plus">＋</button>
    </div>
    <div class="calc-grid" data-price="0">
      <input class="price-input custom-row-price" inputmode="numeric" type="number" min="0" placeholder="価格">
      <button type="button" class="qty-minus">−</button>
      <div class="qty">0冊</div>
      <button type="button" class="qty-plus">＋</button>
    </div>

    <div class="calc-row">
      <div class="field"><label>その他の単価</label><input id="otherPrice" inputmode="numeric" type="number" min="0" placeholder="例：330"></div>
      <div class="field"><label>その他の冊数</label><input id="otherQty" inputmode="numeric" type="number" min="0" placeholder="0"></div>
    </div>

    <div class="field"><label>販売価格</label><input id="salePrice" class="required-input" inputmode="numeric" type="number" min="0" placeholder="必須：例 5980"></div>

    <div class="calc-row">
      <div class="field"><label>販売手数料</label>
        <select id="feeRate">
          <option value="10">メルカリ 10%</option>
          <option value="6">ラクマ 6%</option>
          <option value="5">Yahoo!フリマ 5%</option>
          <option value="0">手数料なし</option>
        </select>
      </div>
      <div class="field"><label>送料</label>
        <select id="shipping" class="required-input">
          <option value="">選択してください</option>
          <option value="750">750円</option>
          <option value="870">870円</option>
          <option value="1070">1070円</option>
          <option value="1200">1200円</option>
        </select>
      </div>
    </div>

    <div class="calc-summary">
      <div><span>仕入れ合計</span><b id="purchaseTotal">0円</b></div>
      <div><span>販売手数料</span><b id="feeAmount">0円</b></div>
      <div><span>利益</span><b id="profitAmount">0円</b></div>
      <div><span>利益率</span><b id="profitRate">0.0%</b></div>
    </div>

    <div id="judgement" class="judgement red">
      <div class="go">🔴 PASS</div>
      <div class="rank">★☆☆☆☆</div>
      <div class="message">販売価格と送料を入力してください</div>
    </div>
    <div class="calc-note">判定基準：3,000円以上＝積極仕入れ／1,500〜2,999円＝とても良い／700〜1,499円＝仕入れOK／700円未満＝基本見送り</div>

    <div class="actions" style="margin-top:14px">
      <button class="cancel" id="resetCalc">リセット</button>
      <button class="save" id="closeCalc">閉じる</button>
    </div>
  </div>
</div>

<div class="modal" id="logModal">
  <div class="sheet">
    <h2>操作履歴</h2>
    <div class="log-list" id="logList"></div>
    <div class="log-actions">
      <button class="danger" id="clearLog">履歴を消去</button>
      <button class="cancel" id="closeLog">閉じる</button>
    </div>
  </div>
</div>

<div class="modal confirm-modal" id="purchaseCancelModal" role="dialog" aria-modal="true" aria-labelledby="purchaseCancelTitle">
  <div class="confirm-box">
    <h2 id="purchaseCancelTitle">購入済みを取り消しますか？</h2>
    <p id="purchaseCancelMessage"></p>
    <div class="confirm-actions">
      <button class="confirm-back" id="keepPurchased" type="button">戻る</button>
      <button class="confirm-remove" id="confirmPurchaseCancel" type="button">取り消す</button>
    </div>
  </div>
</div>

const STORAGE_KEY = "mangaStockPro2State";
const CUSTOM_KEY = "mangaStockPro2Custom";
const HIDDEN_KEY = "mangaStockPro31HiddenTitles";
const LOG_KEY = "mangaStockPro34ActionLog";
function loadSaved(key, fallback) {
  try {
    const saved = localStorage.getItem(key);
    return saved === null ? fallback : JSON.parse(saved);
  } catch (error) {
    console.error("保存データを読み込めませんでした", error);
    return fallback;
  }
}
let state = loadSaved(STORAGE_KEY, {});
let custom = loadSaved(CUSTOM_KEY, []);
let hiddenTitles = loadSaved(HIDDEN_KEY, []);
if (!Array.isArray(hiddenTitles)) hiddenTitles = [];
let actionLog = loadSaved(LOG_KEY, []);
if (!Array.isArray(actionLog)) actionLog = [];
let activeCategory = "すべて";
let purchasedOnly = false;

const app = document.getElementById("app");
const filters = document.getElementById("filters");
const search = document.getElementById("search");
const saveStatus = document.getElementById("saveStatus");
let saveStatusTimer;

function allData() {
  const cloned = JSON.parse(JSON.stringify(MASTER));
  for (const c of custom) {
    let cat = cloned.find(x => x.category === c.category);
    if (!cat) { cat = {category:c.category, items:[]}; cloned.push(cat); }
    cat.items.push(c.item);
  }
  for (const cat of cloned) {
    cat.items = cat.items.filter(item => !hiddenTitles.includes(titleKey(cat.category, item.title)));
  }
  return cloned;
}
function titleKey(cat,title) { return [cat,title].join("|"); }
function keyFor(cat,title,gi,vi) { return [cat,title,gi,vi].join("|"); }
function showSaveStatus(message, type) {
  clearTimeout(saveStatusTimer);
  saveStatus.textContent = message;
  saveStatus.classList.remove("saved", "error");
  if (type) saveStatus.classList.add(type);
  if (type === "saved") {
    saveStatusTimer = setTimeout(() => {
      saveStatus.textContent = "自動保存 ON";
      saveStatus.classList.remove("saved");
    }, 1200);
  }
}
function persist(key, value) {
  try {
    const serialized = JSON.stringify(value);
    localStorage.setItem(key, serialized);
    if (localStorage.getItem(key) !== serialized) throw new Error("保存内容の照合に失敗");
    showSaveStatus("✓ 保存済み", "saved");
    return true;
  } catch (error) {
    console.error("自動保存に失敗しました", error);
    showSaveStatus("保存できません", "error");
    alert("購入状態を保存できませんでした。Safariのプライベートブラウズやストレージ設定をご確認ください。");
    return false;
  }
}
function saveState() { return persist(STORAGE_KEY, state); }
function saveCustom() { return persist(CUSTOM_KEY, custom); }
function saveHiddenTitles() { return persist(HIDDEN_KEY, hiddenTitles); }
function saveActionLog() { return persist(LOG_KEY, actionLog); }
function addLog(action, detail) {
  const previous = actionLog.slice();
  actionLog.unshift({
    time: new Date().toISOString(),
    action,
    detail
  });
  actionLog = actionLog.slice(0, 500);
  if (!saveActionLog()) actionLog = previous;
}
function formatLogTime(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return "";
  return new Intl.DateTimeFormat("ja-JP", {
    year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", second:"2-digit"
  }).format(date);
}
function renderLog() {
  const list = document.getElementById("logList");
  if (!actionLog.length) {
    list.innerHTML = `<div class="log-empty">履歴はまだありません</div>`;
    return;
  }
  list.innerHTML = actionLog.map(log=>`
    <div class="log-item">
      <div class="log-time">${formatLogTime(log.time)}</div>
      <div class="log-text">${log.action}${log.detail ? `：${log.detail}` : ""}</div>
    </div>`).join("");
}

function renderFilters() {
  const cats = ["すべて", ...allData().map(x=>x.category)];
  filters.innerHTML = cats.map(c=>`<button class="filter ${c===activeCategory?"active":""}" data-cat="${c}">${c}</button>`).join("");
  filters.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat; render();});
}

function itemMatches(item,q) {
  if (!q) return true;
  const text = JSON.stringify(item).toLowerCase();
  return text.includes(q.toLowerCase());
}

function render() {
  renderFilters();
  const q = search.value.trim();
  const data = allData();
  let html = purchasedOnly ? `<div class="purchased-guide"><strong>購入済みリスト（「購入済み」をもう一度押すと戻ります）</strong></div>` : "";
  let titles = 0, targets = 0, done = 0;

  for (const cat of data) {
    if (activeCategory !== "すべて" && activeCategory !== cat.category) continue;
    const items = cat.items.filter(i=>itemMatches(i,q) && (!purchasedOnly || itemHasPurchased(cat.category,i)));
    if (!items.length) continue;
    html += `<div class="category-title">${cat.category}</div>`;
    for (const item of items) {
      titles++;
      const cardId = btoa(unescape(encodeURIComponent(cat.category+"|"+item.title))).replace(/=/g,"");
      html += `<section class="card ${purchasedOnly?"open":""}" id="card-${cardId}">
        <div class="card-head"><span class="chev">▶</span><strong>${item.title}</strong><button class="delete-title" type="button" data-category="${encodeURIComponent(cat.category)}" data-title="${encodeURIComponent(item.title)}" aria-label="${item.title}を削除">削除</button></div>
        <div class="card-body">`;
      item.groups.forEach((g,gi)=>{
        html += `<div class="group"><div class="group-label">${g.label}</div>`;
        if (purchasedOnly && g.mode === "note") {
          return;
        } else if (g.mode === "note") {
          html += g.values.map(v=>`<div class="note">${v}</div>`).join("");
        } else if (g.mode === "wanted_count") {
          const counterHtml = g.values.map((v,vi)=>{
            const k = keyFor(cat.category,item.title,gi,vi);
            const val = Math.min(Number(state[k]||0),v.need);
            if (purchasedOnly && val === 0) return "";
            targets += v.need; done += val;
            const boxes = Array.from({length:v.need},(_,i)=>`<span class="counter-box ${i<val?"on":""}"></span>`).join("");
            return `<div class="counter-row tap-counter" data-key="${k}" data-need="${v.need}">
              <span class="counter-name">${v.name}</span><span class="counter-boxes">${boxes}</span><b>${val}/${v.need}</b>
            </div>`;
          }).join("");
          html += counterHtml;
        } else {
          const chipHtml = g.values.map((v,vi)=>{
            const k = keyFor(cat.category,item.title,gi,vi);
            const isDone = !!state[k];
            if (purchasedOnly && !isDone) return "";
            if (g.mode !== "stock" || true) { targets++; if(isDone) done++; }
            const cls = ["chip",g.mode,isDone?"done":""].join(" ");
            return `<button class="${cls}" data-key="${k}">${v}</button>`;
          }).join("");
          if (chipHtml) html += `<div class="chips">${chipHtml}</div>`;
        }
        html += `</div>`;
      });
      html += `</div></section>`;
    }
  }
  if (!titles) html += `<div class="empty">${purchasedOnly?"購入済みの巻はまだありません":"該当する作品がありません"}</div>`;
  app.innerHTML = html;
  document.getElementById("titleCount").textContent = titles;
  document.getElementById("targetCount").textContent = targets;
  document.getElementById("doneCount").textContent = done;
  const purchasedView=document.getElementById("purchasedView");
  purchasedView.classList.toggle("active",purchasedOnly);
  purchasedView.setAttribute("aria-pressed",String(purchasedOnly));

  app.querySelectorAll(".card-head").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));
  app.querySelectorAll(".delete-title").forEach(button=>button.onclick=(e)=>{
    e.stopPropagation();
    if (!button.classList.contains("armed")) {
      app.querySelectorAll(".delete-title.armed").forEach(other=>{
        other.classList.remove("armed");
        other.textContent="削除";
      });
      button.classList.add("armed");
      button.textContent="もう一度押す";
      setTimeout(()=>{
        if (button.isConnected) {
          button.classList.remove("armed");
          button.textContent="削除";
        }
      },3000);
      return;
    }
    const category=decodeURIComponent(button.dataset.category);
    const title=decodeURIComponent(button.dataset.title);
    const key=titleKey(category,title);
    if (!hiddenTitles.includes(key)) hiddenTitles.push(key);
    if(!saveHiddenTitles()){
      hiddenTitles=hiddenTitles.filter(value=>value!==key);
      return;
    }
    const previousCustom=JSON.parse(JSON.stringify(custom));
    custom=custom.filter(value=>!(value.category===category&&value.item?.title===title));
    if(!saveCustom()){
      custom=previousCustom;
      hiddenTitles=hiddenTitles.filter(value=>value!==key);
      saveHiddenTitles();
      return;
    }
    Object.keys(state).forEach(savedKey=>{
      if(savedKey.startsWith(category+"|"+title+"|")) delete state[savedKey];
    });
    saveState();
    addLog("作品削除", title);
    render();
  });
  app.querySelectorAll(".chip").forEach(ch=>ch.onclick=(e)=>{
    e.stopPropagation();
    const previous = !!state[ch.dataset.key];
    const [category,title,gi,vi]=ch.dataset.key.split("|");
    const item=allData().find(cat=>cat.category===category)?.items.find(value=>value.title===title);
    const volume=item?.groups?.[Number(gi)]?.values?.[Number(vi)] ?? ch.textContent;
    if (previous) {
      showPurchaseCancel(ch.dataset.key,title,volume);
      return;
    }
    state[ch.dataset.key] = !previous;
    if (!saveState()) {
      state[ch.dataset.key] = previous;
      return;
    }
    ch.classList.toggle("done", !!state[ch.dataset.key]);
    addLog(state[ch.dataset.key] ? "購入済みに変更" : "購入を取り消し", `${title} ${volume}巻`);
    if (purchasedOnly) render();
    else updateStatsOnly();
  });
  app.querySelectorAll(".tap-counter").forEach(row=>row.onclick=(e)=>{
    e.stopPropagation();
    const k=row.dataset.key, need=Number(row.dataset.need);
    let val=Number(state[k]||0);
    state[k] = val >= need ? 0 : val+1;
    if (!saveState()) {
      state[k] = val;
      return;
    }
    const [category,title,gi,vi]=k.split("|");
    const item=allData().find(cat=>cat.category===category)?.items.find(value=>value.title===title);
    const target=item?.groups?.[Number(gi)]?.values?.[Number(vi)];
    addLog("購入数を変更", `${title} ${target?.name || ""} ${state[k]}/${need}`);
    const openCards=[...app.querySelectorAll(".card.open")].map(x=>x.id);
    render();
    openCards.forEach(id=>document.getElementById(id)?.classList.add("open"));
  });
}

function itemHasPurchased(category,item) {
  return item.groups.some((group,gi)=>{
    if (group.mode === "note") return false;
    return group.values.some((value,vi)=>Number(state[keyFor(category,item.title,gi,vi)]||0)>0);
  });
}

function updateStatsOnly() {
  let total=0, done=0;
  for (const cat of allData()) for (const item of cat.items) for (let gi=0;gi<item.groups.length;gi++) {
    const g=item.groups[gi];
    if(g.mode==="note") continue;
    if(g.mode==="wanted_count") {
      g.values.forEach((v,vi)=>{total+=v.need; done+=Math.min(Number(state[keyFor(cat.category,item.title,gi,vi)]||0),v.need);});
    } else {
      g.values.forEach((v,vi)=>{total++; if(state[keyFor(cat.category,item.title,gi,vi)]) done++;});
    }
  }
  document.getElementById("doneCount").textContent=done;
}

document.getElementById("closeAll").onclick=()=>app.querySelectorAll(".card").forEach(c=>c.classList.remove("open"));

const modal=document.getElementById("modal");
const logModal=document.getElementById("logModal");
const purchaseCancelModal=document.getElementById("purchaseCancelModal");
let pendingPurchaseCancel=null;

function showPurchaseCancel(key,title,volume) {
  pendingPurchaseCancel={key,title,volume};
  document.getElementById("purchaseCancelMessage").textContent=`${title} ${volume}巻を未購入へ戻します。`;
  purchaseCancelModal.classList.add("show");
}

function closePurchaseCancel() {
  purchaseCancelModal.classList.remove("show");
  pendingPurchaseCancel=null;
}

document.getElementById("keepPurchased").onclick=closePurchaseCancel;
document.getElementById("confirmPurchaseCancel").onclick=()=>{
  if (!pendingPurchaseCancel) return;
  const {key,title,volume}=pendingPurchaseCancel;
  const previous=!!state[key];
  state[key]=false;
  if (!saveState()) {
    state[key]=previous;
    return;
  }
  closePurchaseCancel();
  addLog("購入を取り消し",`${title} ${volume}巻`);
  if (purchasedOnly) render();
  else {
    app.querySelector(`.chip[data-key="${CSS.escape(key)}"]`)?.classList.remove("done");
    updateStatsOnly();
  }
};
purchaseCancelModal.addEventListener("click",event=>{
  if (event.target===purchaseCancelModal) closePurchaseCancel();
});
document.getElementById("showLog").onclick=()=>{renderLog();logModal.classList.add("show");};
document.getElementById("closeLog").onclick=()=>logModal.classList.remove("show");
document.getElementById("clearLog").onclick=()=>{
  if (document.getElementById("clearLog").dataset.armed !== "true") {
    document.getElementById("clearLog").dataset.armed="true";
    document.getElementById("clearLog").textContent="もう一度押す";
    setTimeout(()=>{
      document.getElementById("clearLog").dataset.armed="false";
      document.getElementById("clearLog").textContent="履歴を消去";
    },3000);
    return;
  }
  const previous=actionLog.slice();
  actionLog=[];
  if(!saveActionLog()){actionLog=previous;return;}
  document.getElementById("clearLog").dataset.armed="false";
  document.getElementById("clearLog").textContent="履歴を消去";
  renderLog();
};
document.getElementById("addTitle").onclick=()=>modal.classList.add("show");
document.getElementById("cancelAdd").onclick=()=>modal.classList.remove("show");
document.getElementById("newCategory").innerHTML = allData().map(x=>`<option>${x.category}</option>`).join("");
document.getElementById("saveAdd").onclick=()=>{
  const category=document.getElementById("newCategory").value;
  const title=document.getElementById("newTitle").value.trim();
  const finalVolume=Number(document.getElementById("newFinalVolume").value);
  if(!title){alert("作品名を入力してください");return;}
  if(!Number.isInteger(finalVolume)||finalVolume<1||finalVolume>300){alert("最終巻は1〜300の数字で入力してください");return;}
  const values=Array.from({length:finalVolume},(_,i)=>String(i+1));
  const previousHiddenTitles=hiddenTitles;
  hiddenTitles=hiddenTitles.filter(value=>value!==titleKey(category,title));
  if(!saveHiddenTitles()){
    hiddenTitles=previousHiddenTitles;
    return;
  }
  const added = {category,item:{title,finalVolume,groups:[{label:`全巻（1〜${finalVolume}巻）`,mode:"missing",values}]}};
  const existingIndex=custom.findIndex(value=>value.category===category&&value.item?.title===title);
  const previousCustom=JSON.parse(JSON.stringify(custom));
  if(existingIndex>=0) custom[existingIndex]=added;
  else custom.push(added);
  if (!saveCustom()) {
    custom=previousCustom;
    return;
  }
  document.getElementById("newTitle").value="";
  document.getElementById("newFinalVolume").value="";
  modal.classList.remove("show");
  addLog(existingIndex>=0 ? "作品更新" : "作品追加", `${title}（全${finalVolume}巻）`);
  render();
};


const calcModal = document.getElementById("calcModal");
const calcRows = [...document.querySelectorAll("#calcModal .calc-grid")];

function yen(n){ return Math.round(n || 0).toLocaleString("ja-JP") + "円"; }

function calcPurchaseTotal(){
  let total = 0;
  calcRows.forEach(row=>{
    const priceInput = row.querySelector(".custom-row-price");
    const price = priceInput ? Number(priceInput.value || 0) : Number(row.dataset.price);
    const qty = Number(row.dataset.qty || 0);
    total += price * qty;
  });
  total += Number(document.getElementById("otherPrice").value || 0) *
           Number(document.getElementById("otherQty").value || 0);
  return total;
}

function updateCalculator(){
  const purchase = calcPurchaseTotal();
  const saleInput = document.getElementById("salePrice");
  const shippingInput = document.getElementById("shipping");
  const sale = Number(saleInput.value || 0);
  const feeRate = Number(document.getElementById("feeRate").value || 0);
  const shipping = Number(shippingInput.value || 0);
  const fee = Math.floor(sale * feeRate / 100);
  const profit = sale - fee - shipping - purchase;
  const rate = sale > 0 ? (profit / sale) * 100 : 0;

  saleInput.classList.toggle("filled", saleInput.value !== "");
  shippingInput.classList.toggle("filled", shippingInput.value !== "");

  document.getElementById("purchaseTotal").textContent = yen(purchase);
  document.getElementById("feeAmount").textContent = yen(fee);
  document.getElementById("profitAmount").textContent = yen(profit);
  document.getElementById("profitRate").textContent = rate.toFixed(1) + "%";

  const j = document.getElementById("judgement");
  let color = "red", go = "🔴 PASS", rank = "★☆☆☆☆", message = "基本見送り";
  if (!saleInput.value || !shippingInput.value) {
    message = "販売価格と送料を入力してください";
  } else if (profit >= 3000) {
    color = "green"; go = "🟢 GO！"; rank = "★★★★★"; message = "積極的に仕入れ";
  } else if (profit >= 1500) {
    color = "blue"; go = "🔵 GO！"; rank = "★★★★☆"; message = "とても良い";
  } else if (profit >= 700) {
    color = "yellow"; go = "🟡 GO"; rank = "★★★☆☆"; message = "仕入れOK";
  }
  j.className = "judgement " + color;
  j.innerHTML = `<div class="go">${go}</div><div class="rank">${rank}</div><div class="message">${message}</div>`;
}

calcRows.forEach(row=>{
  row.dataset.qty = "0";
  const qtyEl = row.querySelector(".qty");
  row.querySelector(".qty-plus").onclick = ()=>{
    row.dataset.qty = String(Number(row.dataset.qty || 0) + 1);
    qtyEl.textContent = row.dataset.qty + "冊";
    updateCalculator();
  };
  row.querySelector(".qty-minus").onclick = ()=>{
    row.dataset.qty = String(Math.max(0, Number(row.dataset.qty || 0) - 1));
    qtyEl.textContent = row.dataset.qty + "冊";
    updateCalculator();
  };
});

["otherPrice","otherQty","salePrice","feeRate","shipping"].forEach(id=>{
  document.getElementById(id).addEventListener("input", updateCalculator);
  document.getElementById(id).addEventListener("change", updateCalculator);
});
document.querySelectorAll(".custom-row-price").forEach(input=>{
  input.addEventListener("input", updateCalculator);
  input.addEventListener("change", updateCalculator);
});
document.querySelectorAll("#calcModal button").forEach(btn=>{
  btn.addEventListener("dblclick", e=>e.preventDefault());
});

document.getElementById("openCalc").onclick = ()=>{
  calcModal.classList.add("show");
  updateCalculator();
};
document.getElementById("closeCalc").onclick = ()=>calcModal.classList.remove("show");
document.getElementById("resetCalc").onclick = ()=>{
  calcRows.forEach(row=>{
    row.dataset.qty = "0";
    row.querySelector(".qty").textContent = "0冊";
  });
  ["otherPrice","otherQty","salePrice"].forEach(id=>document.getElementById(id).value="");
  document.querySelectorAll(".custom-row-price").forEach(input=>input.value="");
  document.getElementById("shipping").value="";
  document.getElementById("feeRate").value="10";
  updateCalculator();
};
