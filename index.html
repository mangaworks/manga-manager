
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マンガ管理</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;margin:20px}
h1{text-align:center}
.card{background:#fff;padding:15px;border-radius:10px;max-width:700px;margin:auto}
button{margin:4px;padding:8px 12px;border:none;border-radius:6px;cursor:pointer}
.done{background:#4caf50;color:#fff}
.todo{background:#ddd}
</style>
</head>
<body>
<div class="card">
<h1>📚 マンガ管理</h1>
<p>タイトルを追加して、巻数をタップすると購入済みとして保存できます。</p>
<input id="title" placeholder="作品名">
<button onclick="add()">追加</button>
<div id="list"></div>
</div>
<script>
let data=JSON.parse(localStorage.getItem("mangaData")||"[]");
function save(){localStorage.setItem("mangaData",JSON.stringify(data));draw();}
function add(){
 let t=document.getElementById("title").value.trim();
 if(!t)return;
 data.push({title:t,done:false});
 document.getElementById("title").value="";
 save();
}
function toggle(i){data[i].done=!data[i].done;save();}
function draw(){
 let l=document.getElementById("list");
 l.innerHTML="";
 data.forEach((m,i)=>{
   let b=document.createElement("button");
   b.className=m.done?"done":"todo";
   b.textContent=(m.done?"✓ ":"○ ")+m.title;
   b.onclick=()=>toggle(i);
   l.appendChild(b);
   l.appendChild(document.createElement("br"));
 });
}
draw();
</script>
</body>
</html>
