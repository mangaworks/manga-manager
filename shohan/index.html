<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>初版掲載画像 Pro 1.6</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif}
main{max-width:720px;margin:auto;padding:18px 14px 42px}
h1{margin:2px 0 20px;color:#ffd23f;font-size:25px}
label{display:block;margin:15px 0 7px;font-weight:800;color:#ddd}
input{width:100%;height:56px;padding:0 14px;border:1px solid #555;border-radius:13px;background:#1c1c1c;color:#fff;font-size:20px}
#numbers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:18px}
.num{height:64px;border:2px solid #555;border-radius:13px;background:#252525;color:#fff;font-size:26px;font-weight:900}
.num.on{background:#31cf7c;border-color:#31cf7c;color:#07150d}
.help{margin-top:10px;color:#999;font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:20px}
.actions button{height:58px;border-radius:14px;font-size:17px;font-weight:900}
.clear{background:#252525;color:#fff;border:1px solid #555}
.save{background:#ff9500;color:#111;border:0}
.status{min-height:24px;margin-top:12px;color:#ffd23f;font-size:14px;font-weight:800;text-align:center}
</style>
</head>
<body>
<main>
<h1>初版掲載画像 Pro 1.6</h1>

<label for="title">作品名</label>
<input id="title" type="text" autocomplete="off">

<label for="total">全巻</label>
<input id="total" type="text" inputmode="numeric" pattern="[0-9０-９]*" enterkeyhint="done" autocomplete="off">

<div id="numbers"></div>
<div class="help">緑色が初版巻です。初版の巻をタップしてください。選択済みの巻を再タップした場合は解除確認が出ます。</div>

<div class="actions">
<button id="clear" class="clear" type="button">全クリア</button>
<button id="save" class="save" type="button">掲載画像を保存</button>
</div>
<div id="status" class="status" aria-live="polite"></div>
</main>

<script>
(function(){
"use strict";
var title=document.getElementById("title");
var total=document.getElementById("total");
var numbers=document.getElementById("numbers");
var status=document.getElementById("status");
var selected={};

function normalizeDigits(value){
  return String(value||"").replace(/[０-９]/g,function(ch){
    return String.fromCharCode(ch.charCodeAt(0)-65248);
  });
}
function numericValue(){
  var s=normalizeDigits(total.value).replace(/[^0-9]/g,"");
  return parseInt(s,10)||0;
}
function render(){
  var n=numericValue();
  if(n>150)n=150;
  numbers.innerHTML="";
  if(n<1)return;
  for(var i=1;i<=n;i++){
    var b=document.createElement("button");
    b.type="button";
    b.className=selected[i]?"num on":"num";
    b.textContent=String(i);
    b.setAttribute("data-volume",String(i));
    numbers.appendChild(b);
  }
}
numbers.addEventListener("click",function(e){
  var b=e.target.closest("button[data-volume]");
  if(!b)return;
  var v=parseInt(b.getAttribute("data-volume"),10);
  if(selected[v]){
    if(window.confirm(v+"巻の初版登録を解除しますか？")){
      delete selected[v];
      b.className="num";
    }
  }else{
    selected[v]=true;
    b.className="num on";
  }
});
function changed(){
  selected={};
  render();
}
total.addEventListener("input",changed);
total.addEventListener("keyup",changed);
total.addEventListener("change",changed);
total.addEventListener("blur",render);
total.addEventListener("compositionend",changed);
total.addEventListener("paste",function(){setTimeout(changed,0);});

function resetAll(){
  title.value="";
  total.value="";
  selected={};
  render();
  title.focus();
}
document.getElementById("clear").addEventListener("click",function(){
  if(window.confirm("入力内容をすべて消去しますか？"))resetAll();
});

function roundedRect(ctx,x,y,w,h,r){
  var rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.lineTo(x+w-rr,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+rr);
  ctx.lineTo(x+w,y+h-rr);
  ctx.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
  ctx.lineTo(x+rr,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-rr);
  ctx.lineTo(x+rr,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-rr);
  ctx.lineTo(x,y+rr);
  ctx.quadraticCurveTo(x,y,x+rr,y);
  ctx.closePath();
}
function dataUrlToBlob(dataUrl){
  var parts=dataUrl.split(",");
  var bytes=atob(parts[1]);
  var array=new Uint8Array(bytes.length);
  for(var i=0;i<bytes.length;i++)array[i]=bytes.charCodeAt(i);
  return new Blob([array],{type:"image/png"});
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)||
    (navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
}
function downloadBlob(blob,fileName){
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.download=fileName;
  a.href=url;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},30000);
}
document.getElementById("save").addEventListener("click",function(){
  var n=numericValue();
  if(n<1){alert("全巻数を入力してください。");return;}
  if(n>150)n=150;
  var canvas=document.createElement("canvas");
  canvas.width=720;canvas.height=720;
  var c=canvas.getContext("2d");
  c.fillStyle="#080808";c.fillRect(0,0,720,720);
  c.strokeStyle="#ff9500";c.lineWidth=24;roundedRect(c,14,14,692,692,22);c.stroke();
  c.textAlign="left";c.textBaseline="middle";
  var heading=title.value.trim()||"初版巻一覧";
  var volumeHeading="全"+n+"巻";
  var titleSize=38,volumeSize=34,headingGap=20;
  var titleWidth,volumeWidth;
  do{
    c.font="900 "+titleSize+"px -apple-system,BlinkMacSystemFont,sans-serif";
    titleWidth=c.measureText(heading).width;
    c.font="900 "+volumeSize+"px -apple-system,BlinkMacSystemFont,sans-serif";
    volumeWidth=c.measureText(volumeHeading).width;
    if(titleWidth+volumeWidth+headingGap<=620||titleSize<=18)break;
    titleSize--;volumeSize=Math.max(18,volumeSize-1);
  }while(true);
  var titleDisplayWidth=Math.min(titleWidth,620-volumeWidth-headingGap);
  var headingX=(720-titleDisplayWidth-volumeWidth-headingGap)/2;
  c.fillStyle="#fff";
  c.font="900 "+titleSize+"px -apple-system,BlinkMacSystemFont,sans-serif";
  c.fillText(heading,headingX,73,titleDisplayWidth);
  c.fillStyle="#ffd23f";
  c.font="900 "+volumeSize+"px -apple-system,BlinkMacSystemFont,sans-serif";
  c.fillText(volumeHeading,headingX+titleDisplayWidth+headingGap,73);

  var note="以下緑色は初版巻です";
  c.font="900 25px -apple-system,BlinkMacSystemFont,sans-serif";
  var noteWidth=c.measureText(note).width;
  var noteDisplayWidth=Math.min(noteWidth,560);
  var noteX=(720-noteDisplayWidth-38)/2;
  c.fillStyle="#31cf7c";
  roundedRect(c,noteX,117,24,24,6);c.fill();
  c.fillStyle="#fff";
  c.fillText(note,noteX+38,129,noteDisplayWidth);

  var cols=n<=35?5:6, rows=Math.ceil(n/cols);
  var gapX=9,gapY=8,left=45,top=176,bottom=88;
  var bw=(630-gapX*(cols-1))/cols;
  var bh=Math.min(61,(720-top-bottom-gapY*(rows-1))/rows);
  c.textAlign="center";
  c.textBaseline="middle";
  for(var k=1;k<=n;k++){
    var row=Math.floor((k-1)/cols),col=(k-1)%cols;
    var x=left+col*(bw+gapX),y=top+row*(bh+gapY);
    c.fillStyle=selected[k]?"#31cf7c":"#252525";
    roundedRect(c,x,y,bw,bh,14);c.fill();
    c.fillStyle=selected[k]?"#07150d":"#fff";
    c.font="900 "+Math.max(15,Math.min(27,bh*.48))+"px -apple-system,BlinkMacSystemFont,sans-serif";
    c.fillText(String(k),Math.round(x+bw/2),Math.round(y+bh/2)+1);
  }
  var selectedCount=0;
  for(var volume=1;volume<=n;volume++){
    if(selected[volume])selectedCount++;
  }
  var firstEditionRate=Math.round(selectedCount/n*100);
  c.textAlign="right";
  c.textBaseline="middle";
  c.fillStyle="#ffd23f";
  c.font="900 42px -apple-system,BlinkMacSystemFont,sans-serif";
  c.fillText("初版率",478,645);
  c.fillStyle="#fff";
  c.font="900 78px -apple-system,BlinkMacSystemFont,sans-serif";
  c.fillText(firstEditionRate+"%",676,645,184);
  var fileName=(title.value.trim()||"初版巻一覧")+"_初版.png";
  var blob=dataUrlToBlob(canvas.toDataURL("image/png"));
  var file;
  try{file=new File([blob],fileName,{type:"image/png"});}catch(e){file=null;}

  if(isIOS()&&file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    status.textContent="共有画面で「画像を保存」を選んでください。";
    navigator.share({files:[file],title:"初版掲載画像"}).then(function(){
      status.textContent="画像の共有が完了しました。";
      resetAll();
    }).catch(function(err){
      if(err&&err.name==="AbortError"){
        status.textContent="保存はキャンセルされました。入力内容は残っています。";
        return;
      }
      downloadBlob(blob,fileName);
      status.textContent="画像を開きました。長押しして「写真に保存」を選んでください。";
    });
  }else{
    downloadBlob(blob,fileName);
    status.textContent="画像を保存しました。";
    resetAll();
  }
});
render();
})();
</script>
</body>
</html>
